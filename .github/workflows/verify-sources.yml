# Do the URLs in content/verified.json actually resolve?
#
# content/verified.json decides which phone numbers and links the app shows a
# person in trouble. Every row carries a source_url so the claim can be
# re-checked. The machine this repo is edited from cannot open any of them —
# the egress proxy refuses psd.gov.jo — so a URL written there is an assertion
# nobody has tested until this job runs.
#
# What this job can and cannot settle:
#
#   - A 4xx or 5xx is a real answer. The host exists, and it says that page
#     does not. On a row the app ships, that is fatal: a link that 404s in
#     front of someone in trouble is the app sending them nowhere.
#   - A connection that never completes is NOT an answer. Jordanian government
#     hosts do not respond to a GitHub runner in the US or EU at all — every
#     psd.gov.jo request from here times out after the full 25 seconds, and so
#     does jocert.ncsc.jo. That is what a geo-filtered government site looks
#     like from abroad, and it says nothing about what a phone in Amman sees.
#     So it is reported and never fatal.
#
# Which means: for a .gov.jo host this job can prove a link is broken and can
# never prove it works. The only test that does is a phone in Jordan.
name: verify-sources

on:
  workflow_dispatch:
    inputs:
      probe:
        description: >-
          Candidate URLs to probe, space separated. Probing never fails the
          job — it is how a deeper path earns its way into the content file
          instead of being guessed at.
        default: ""
  push:
    paths:
      - content/verified.json
      - .github/workflows/verify-sources.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every URL the content file ships
        run: |
          # jq walks the whole document and takes anything under a key ending
          # in "url", rather than a hand-typed list of paths into the file: a
          # URL added to the content file and not to this job is exactly the
          # URL that would go unchecked. Each one is tagged with its row's
          # verified flag, because only a row that ships can put a dead link in
          # front of a person — a staged row renders nowhere yet.
          jq -r '
            [ .. | objects | select(has("verified"))
              | .verified as $v
              | to_entries[]
              | select(.key | test("url$"))
              | .value | select(type == "string")
              | [ (if $v then "ships" else "staged" end), . ]
            ] | unique | .[] | @tsv
          ' content/verified.json > /tmp/urls.tsv

          echo "=== URLs in content/verified.json ==="
          BAD=0
          UNREACHED=0
          while IFS=$'\t' read -r state u; do
            [ -n "$u" ] || continue

            # curl's exit code is the evidence for which of the two cases this
            # is; the status code alone cannot tell "the host said no" from
            # "the host never spoke". -L because these sites redirect between
            # language variants, and a 200 after following is what a phone
            # would experience.
            set +e
            code=$(curl -sSL --max-time 25 -o /dev/null -w "%{http_code}" "$u" 2>/dev/null)
            rc=$?
            set -e

            if [ "$rc" -ne 0 ]; then
              # 28 timeout, 6 DNS, 7 refused, 35 TLS. None of them is the host
              # answering, so none of them is this link being broken.
              echo "  ??  [$state]  $u  — no answer at all (curl exit $rc). Inconclusive from this runner."
              UNREACHED=$((UNREACHED + 1))
              continue
            fi

            case "$code" in
              2*|3*) echo "  ok  [$state]  $u  ($code)" ;;
              *)
                if [ "$state" = ships ]; then
                  echo "FAILS [$state]  $u  ($code) — the host answered and this page is not there"
                  BAD=1
                else
                  echo "  --  [$state]  $u  ($code) — dead, but staged: it renders nowhere yet"
                fi ;;
            esac
          done < /tmp/urls.tsv

          echo
          if [ "$BAD" = 1 ]; then
            echo "VERDICT: a URL the app ships is answered with an error. Do not ship it."
            exit 1
          fi
          if [ "$UNREACHED" -gt 0 ]; then
            echo "VERDICT: nothing is broken. $UNREACHED URL(s) never answered this runner,"
            echo "which is what a Jordanian government host does to foreign traffic and is"
            echo "not evidence either way. Those have to be opened on a phone in Jordan."
          else
            echo "VERDICT: every URL this file ships resolves."
          fi

      - name: Candidate paths (probe only, never fails)
        if: inputs.probe != ''
        env:
          # Through the environment, never interpolated into the script: a
          # dispatch input pasted straight into a shell line is a command
          # someone else gets to write.
          PROBE: ${{ inputs.probe }}
        run: |
          # A deeper path is more useful to a person than a site root, but only
          # if it exists. This prints what each candidate actually does so the
          # one that ships is the one that answered, not the one that read well.
          echo "=== candidates ==="
          for u in $PROBE; do
            set +e
            out=$(curl -sSL --max-time 25 -o /tmp/body.html -w "%{http_code} %{url_effective}" "$u" 2>/dev/null)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "no answer (curl exit $rc)  $u"
            else
              echo "$out"
              # A site that answers 200 with its own "page not found" is the
              # trap a status code alone walks into, so the title is printed.
              grep -o '<title>[^<]*</title>' /tmp/body.html 2>/dev/null | head -1 || true
            fi
            echo
          done
