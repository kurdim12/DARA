# Is what is deployed the same thing as what is in this repository?
#
# The machine this repo is edited from cannot reach the workers.dev URL — the
# egress proxy refuses it — so every claim about "the live site" has to be made
# from somewhere that can. This job is that somewhere. It takes seconds and
# answers one question: which build is answering.
name: deploy-check

on:
  workflow_dispatch:
    inputs:
      target:
        description: The deployed URL to check
        default: https://dara.abdalrhmankurdi12.workers.dev
  push:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The verdict resolves the SHA baked into the LIVE bundle against
          # this repo's history. checkout's default depth-1 clone has no
          # object for any earlier commit, so every candidate failed
          # `git cat-file -e` and the verdict was a permanent UNKNOWN.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: What is live
        env:
          TARGET: ${{ inputs.target || 'https://dara.abdalrhmankurdi12.workers.dev' }}
        run: |
          echo "=== COMMIT IN THIS REPO ==="
          git rev-parse --short HEAD

          echo "=== /api/health ==="
          curl -sS --max-time 20 "$TARGET/api/health" || echo "(unreachable)"
          echo

          # Added in the rebuild. On the previous build this path falls through
          # to the catch-all and answers {"error":"not_found"}.
          echo "=== /api/threats (exists only in the rebuild) ==="
          curl -sS --max-time 20 -o /tmp/threats.txt -w "http=%{http_code}\n" "$TARGET/api/threats" || echo "(unreachable)"
          cat /tmp/threats.txt; echo

          # Added in phase 2 of the rebuild.
          echo "=== /api/reports/community (exists only in the rebuild) ==="
          curl -sS --max-time 20 -o /tmp/community.txt -w "http=%{http_code}\n" "$TARGET/api/reports/community" || echo "(unreachable)"
          cat /tmp/community.txt; echo

          # Self-hosted since the facelift. A missing font would not break the
          # page — it would quietly swap a typeface for the system font, which
          # is the kind of thing you notice on stage and not before.
          #
          # The status code alone cannot see it: an SPA catch-all answers a
          # missing /fonts/*.woff2 with index.html and a cheerful 200. The
          # content-type is what tells the truth, so that is what is asserted.
          # The list comes from the stylesheet in THIS commit rather than being
          # typed here, because a font swap otherwise leaves this step checking
          # files nobody loads any more.
          echo "=== fonts, served from /public/fonts ==="
          FONT_BAD=0
          for f in $(grep -o '/fonts/[a-z0-9.-]*\.woff2' src/styles/fonts.css | sort -u); do
            out=$(curl -sS --max-time 20 -o /dev/null \
              -w "%{http_code} %{content_type}" "$TARGET$f" || echo "--- none")
            code=${out%% *}
            type=${out##* }
            case "$type" in
              font/woff2|application/font-woff2|application/octet-stream) mark="ok" ;;
              *) mark="WRONG TYPE — this font is not being served"; FONT_BAD=1 ;;
            esac
            echo "$f http=$code type=$type $mark"
          done
          if [ "$FONT_BAD" = 1 ]; then
            echo "FONTS: at least one typeface is missing on the deployment"
          else
            echo "FONTS: all $(grep -o '/fonts/[a-z0-9.-]*\.woff2' src/styles/fonts.css | sort -u | wc -l) referenced files are served as fonts"
          fi
          echo

          # The app is Arabic-first: the served HTML must already say
          # lang="ar" dir="rtl" before any JavaScript runs, or the first paint
          # is left-to-right and the whole layout visibly flips a frame later.
          echo "=== root <html> tag ==="
          HTML_TAG=$(curl -sS --max-time 20 "$TARGET/" | head -c 400 | tr -d '\n' | grep -o '<html[^>]*>' || echo "(none)")
          echo "$HTML_TAG"
          case "$HTML_TAG" in
            *'lang="ar"'*'dir="rtl"'*) echo "ok — Arabic-first on the first paint" ;;
            *) echo "WRONG — the served HTML is not Arabic-first" ;;
          esac
          echo

          # Vite's asset hash is content-addressed, so building this commit
          # here and comparing the hash to the one the live site serves says
          # whether THIS EXACT commit is deployed — not just "something recent".
          # Edge caching is the other way a device can see an old page while
          # CI sees a new one: a long-lived copy of / sitting in one region's
          # cache. These headers say whether that is happening.
          echo "=== response headers on / ==="
          curl -sS --max-time 20 -D - -o /dev/null "$TARGET/" \
            | grep -iE "^(cache-control|age|cf-cache-status|etag|last-modified|date):" || echo "(none of interest)"
          echo

          echo "=== response headers on the JS bundle ==="
          ASSET=$(curl -sS --max-time 20 "$TARGET/" | grep -o '/assets/[^"]*\.js' | head -1)
          echo "asset: $ASSET"
          curl -sS --max-time 20 -D - -o /dev/null "$TARGET$ASSET" \
            | grep -iE "^(cache-control|age|cf-cache-status):" || echo "(none of interest)"
          echo

          echo "=== /api/reset reachable (the escape hatch) ==="
          curl -sS --max-time 20 -o /dev/null -w "http=%{http_code}\n" "$TARGET/api/reset"

          # vite.config.ts bakes the short commit SHA into the bundle as
          # __BUILD_ID__, so the deployment can simply be asked which commit it
          # was built from. That is a straight answer; the asset hash is not,
          # because the SHA is IN the bundle and so a docs-only commit changes
          # the hash without changing a line of app code.
          echo "=== which commit is live ==="
          curl -sS --max-time 20 -o /tmp/live.js "$TARGET$ASSET" || true
          # A 7-hex run in minified output could coincidentally spell some
          # other commit, so every candidate that is a real commit is printed,
          # and the one chosen is an ancestor of HEAD — which a deployed build
          # always is and a coincidence almost never is.
          LIVE_SHA=""
          for c in $(grep -oE '\b[0-9a-f]{7}\b' /tmp/live.js | sort -u); do
            git cat-file -e "$c^{commit}" 2>/dev/null || continue
            echo "candidate: $c $(git log -1 --format='%s' "$c" | cut -c1-60)"
            CANDIDATES="${CANDIDATES:+$CANDIDATES }$c"
            if git merge-base --is-ancestor "$c" HEAD 2>/dev/null; then LIVE_SHA=$c; fi
          done
          HEAD_SHA=$(git rev-parse --short=7 HEAD)
          echo "live:        ${LIVE_SHA:-(no build id found in the bundle)}"
          echo "this commit: $HEAD_SHA"
          if [ -n "$LIVE_SHA" ]; then
            echo "live commit: $(git log -1 --format='%h %ad %s' --date=short "$LIVE_SHA" 2>/dev/null)"
            BEHIND_BY=$(git rev-list --count "$LIVE_SHA..$HEAD_SHA" 2>/dev/null || echo "?")
            echo "commits since: $BEHIND_BY"
            echo "app code differs:"
            git diff --stat "$LIVE_SHA..$HEAD_SHA" -- src worker shared content public index.html \
              vite.config.ts wrangler.jsonc 2>/dev/null | tail -5 || true
          fi

          echo "=== VERDICT ==="
          if ! grep -q '"counts"' /tmp/threats.txt 2>/dev/null; then
            echo "STALE: the live build predates the rebuild — /api/threats does not exist on it"
          elif [ -z "$LIVE_SHA" ]; then
            echo "UNKNOWN: no commit id in the live bundle resolved against this repo."
            echo "  candidates seen: ${CANDIDATES:-none}"
            echo "  none / all unresolvable usually means a shallow clone;"
            echo "  resolvable but not an ancestor means the deploy came from another branch."
          elif [ "$LIVE_SHA" = "$HEAD_SHA" ]; then
            echo "CURRENT: the live site is serving this exact commit"
          elif [ -z "$(git diff --name-only "$LIVE_SHA..$HEAD_SHA" -- src worker shared content public index.html vite.config.ts wrangler.jsonc 2>/dev/null)" ]; then
            echo "CURRENT: the live site is $BEHIND_BY commit(s) back, and none of them touched the app"
          else
            echo "BEHIND: app code has changed since the commit that is live"
          fi
